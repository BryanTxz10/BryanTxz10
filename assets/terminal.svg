<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" role="img" aria-label="whoami — Bryan Cucho Suyo, Telecom Engineer">
  <title>bryan@archlinux — neofetch</title>
  <defs>
    <radialGradient id="earth" cx="38%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#7dcfff"/>
      <stop offset="55%" stop-color="#1793D1"/>
      <stop offset="100%" stop-color="#0b3d5c"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#1793D1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1793D1" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="typing">
      <rect x="214" y="48" height="26" width="0">
        <animate attributeName="width" values="0;9;18;27;36;45;54;63;72" calcMode="discrete" begin="0.3s" dur="0.8s" fill="freeze"/>
      </rect>
    </clipPath>
    <path id="orbit" d="M 852 230 A 80 30 0 1 1 1012 230 A 80 30 0 1 1 852 230"/>
  </defs>

  <style>
    text { font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace; }
    .logo { font-size: 12px; fill: #1793D1; }
    .info { font-size: 14px; fill: #c0caf5; }
    .key  { fill: #1793D1; font-weight: 700; }
    .user { fill: #1793D1; font-weight: 700; }
    .dim  { fill: #565f89; }
    .ok   { fill: #9ece6a; }
    .hl   { fill: #e0af68; }
    .star { fill: #c0caf5; }
  </style>

  <!-- Window -->
  <rect x="0.5" y="0.5" width="1039" height="469" rx="12" fill="#1a1b26" stroke="#2f334d"/>
  <path d="M0.5 12.5 a12 12 0 0 1 12 -12 h1015 a12 12 0 0 1 12 12 v23.5 h-1039 z" fill="#16161e"/>
  <circle cx="22" cy="18" r="6" fill="#f7768e"/>
  <circle cx="42" cy="18" r="6" fill="#e0af68"/>
  <circle cx="62" cy="18" r="6" fill="#9ece6a"/>
  <text x="520" y="23" text-anchor="middle" class="info dim" style="font-size:13px">bryan@archlinux: ~</text>

  <!-- Prompt + typed command -->
  <text x="30" y="66" class="info"><tspan class="ok">[</tspan><tspan class="user">bryan</tspan><tspan>@</tspan><tspan class="user">archlinux</tspan><tspan> ~</tspan><tspan class="ok">]$</tspan></text>
  <text x="214" y="66" class="info" clip-path="url(#typing)">neofetch</text>

  <!-- Arch logo -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.5s" fill="freeze"/>
    <text class="logo" xml:space="preserve">
      <tspan x="30" y="100">                   -`</tspan>
      <tspan x="30" y="117">                  .o+`</tspan>
      <tspan x="30" y="134">                 `ooo/</tspan>
      <tspan x="30" y="151">                `+oooo:</tspan>
      <tspan x="30" y="168">               `+oooooo:</tspan>
      <tspan x="30" y="185">               -+oooooo+:</tspan>
      <tspan x="30" y="202">             `/:-:++oooo+:</tspan>
      <tspan x="30" y="219">            `/++++/+++++++:</tspan>
      <tspan x="30" y="236">           `/++++++++++++++:</tspan>
      <tspan x="30" y="253">          `/+++ooooooooooooo/`</tspan>
      <tspan x="30" y="270">         ./ooosssso++osssssso+`</tspan>
      <tspan x="30" y="287">        .oossssso-````/ossssss+`</tspan>
      <tspan x="30" y="304">       -osssssso.      :ssssssso.</tspan>
      <tspan x="30" y="321">      :osssssss/        osssso+++.</tspan>
      <tspan x="30" y="338">     /ossssssss/        +ssssooo/-</tspan>
      <tspan x="30" y="355">   `/ossssso+/:-        -:/+osssso+-</tspan>
      <tspan x="30" y="372">  `+sso+:-`                 `.-/+oso:</tspan>
      <tspan x="30" y="389"> `++:.                           `-/+/</tspan>
      <tspan x="30" y="406"> .`                                 `/</tspan>
    </text>
  </g>

  <!-- Info lines (staggered reveal) -->
  <g class="info">
    <text x="335" y="104" opacity="0"><animate attributeName="opacity" to="1" begin="1.5s" dur="0.3s" fill="freeze"/><tspan class="user">bryan</tspan>@<tspan class="user">archlinux</tspan></text>
    <text x="335" y="126" opacity="0" class="dim"><animate attributeName="opacity" to="1" begin="1.6s" dur="0.3s" fill="freeze"/>---------------</text>
    <text x="335" y="150" opacity="0"><animate attributeName="opacity" to="1" begin="1.75s" dur="0.3s" fill="freeze"/><tspan class="key">Name</tspan>: Bryan Cucho Suyo</text>
    <text x="335" y="174" opacity="0"><animate attributeName="opacity" to="1" begin="1.9s" dur="0.3s" fill="freeze"/><tspan class="key">Role</tspan>: Telecom Engineer → Pre-Sales / Platform Engineering</text>
    <text x="335" y="198" opacity="0"><animate attributeName="opacity" to="1" begin="2.05s" dur="0.3s" fill="freeze"/><tspan class="key">Location</tspan>: Lima, Peru → Paris, France</text>
    <text x="335" y="222" opacity="0"><animate attributeName="opacity" to="1" begin="2.2s" dur="0.3s" fill="freeze"/><tspan class="key">Study</tspan>: Télécom Paris - IP Paris (Double Degree, M2)</text>
    <text x="335" y="246" opacity="0"><animate attributeName="opacity" to="1" begin="2.35s" dur="0.3s" fill="freeze"/><tspan class="key">Focus</tspan>: Network · Cloud · 5G · Security</text>
    <text x="335" y="270" opacity="0"><animate attributeName="opacity" to="1" begin="2.5s" dur="0.3s" fill="freeze"/><tspan class="key">Experience</tspan>: Pre-Sales @ Huawei (Videoconf, CDN/IPTV)</text>
    <text x="335" y="294" opacity="0"><animate attributeName="opacity" to="1" begin="2.65s" dur="0.3s" fill="freeze"/><tspan class="key">Languages</tspan>: ES (native) · EN (C1) · FR (B1)</text>
    <text x="335" y="318" opacity="0"><animate attributeName="opacity" to="1" begin="2.8s" dur="0.3s" fill="freeze"/><tspan class="key">Score</tspan>: <tspan class="hl">GPA 4.0 · Top of Class</tspan></text>

    <!-- Color palette -->
    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="3s" dur="0.4s" fill="freeze"/>
      <rect x="335" y="342" width="28" height="16" fill="#15161e"/>
      <rect x="363" y="342" width="28" height="16" fill="#f7768e"/>
      <rect x="391" y="342" width="28" height="16" fill="#9ece6a"/>
      <rect x="419" y="342" width="28" height="16" fill="#e0af68"/>
      <rect x="447" y="342" width="28" height="16" fill="#7aa2f7"/>
      <rect x="475" y="342" width="28" height="16" fill="#bb9af7"/>
      <rect x="503" y="342" width="28" height="16" fill="#7dcfff"/>
      <rect x="531" y="342" width="28" height="16" fill="#a9b1d6"/>
      <rect x="335" y="358" width="28" height="16" fill="#414868"/>
      <rect x="363" y="358" width="28" height="16" fill="#ff7a93"/>
      <rect x="391" y="358" width="28" height="16" fill="#b9f27c"/>
      <rect x="419" y="358" width="28" height="16" fill="#ff9e64"/>
      <rect x="447" y="358" width="28" height="16" fill="#7da6ff"/>
      <rect x="475" y="358" width="28" height="16" fill="#9D6FE0"/>
      <rect x="503" y="358" width="28" height="16" fill="#0db9d7"/>
      <rect x="531" y="358" width="28" height="16" fill="#c0caf5"/>
    </g>
  </g>

  <!-- Final prompt with blinking cursor -->
  <g opacity="0">
    <animate attributeName="opacity" to="1" begin="3.3s" dur="0.2s" fill="freeze"/>
    <text x="30" y="444" class="info"><tspan class="ok">[</tspan><tspan class="user">bryan</tspan><tspan>@</tspan><tspan class="user">archlinux</tspan><tspan> ~</tspan><tspan class="ok">]$</tspan></text>
    <rect x="214" y="431" width="9" height="17" fill="#c0caf5">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Space scene: twinkling stars -->
  <g>
    <circle class="star" cx="870" cy="90"  r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle class="star" cx="1000" cy="110" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle class="star" cx="955" cy="70"  r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle class="star" cx="845" cy="330" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle class="star" cx="1010" cy="345" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle class="star" cx="900" cy="365" r="1"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle class="star" cx="990" cy="160" r="0.9"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Earth -->
  <circle cx="932" cy="230" r="52" fill="url(#glow)"/>
  <circle cx="932" cy="230" r="34" fill="url(#earth)"/>
  <g fill="none" stroke="#7dcfff" stroke-opacity="0.35" stroke-width="1">
    <ellipse cx="932" cy="230" rx="34" ry="12"/>
    <ellipse cx="932" cy="230" rx="14" ry="34"/>
    <line x1="898" y1="230" x2="966" y2="230"/>
  </g>
  <!-- Ground stations: Lima & Paris -->
  <circle cx="918" cy="243" r="2.5" fill="#e0af68"/>
  <circle cx="918" cy="243" r="2.5" fill="none" stroke="#e0af68">
    <animate attributeName="r" values="2.5;10" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="944" cy="214" r="2.5" fill="#9ece6a"/>
  <circle cx="944" cy="214" r="2.5" fill="none" stroke="#9ece6a">
    <animate attributeName="r" values="2.5;10" dur="2s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>

  <!-- Orbit + satellite -->
  <g transform="rotate(-18 932 230)">
    <use href="#orbit" fill="none" stroke="#565f89" stroke-dasharray="3 5"/>
    <g>
      <animateMotion dur="9s" repeatCount="indefinite">
        <mpath href="#orbit"/>
      </animateMotion>
      <circle r="5" fill="none" stroke="#7dcfff">
        <animate attributeName="r" values="5;20" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <g transform="rotate(18)">
        <rect x="-24" y="-3.5" width="15" height="7" fill="#1793D1" stroke="#7dcfff" stroke-width="0.6"/>
        <rect x="9" y="-3.5" width="15" height="7" fill="#1793D1" stroke="#7dcfff" stroke-width="0.6"/>
        <line x1="-9" y1="0" x2="9" y2="0" stroke="#a9b1d6" stroke-width="1"/>
        <rect x="-5" y="-5" width="10" height="10" rx="1.5" fill="#c0caf5"/>
        <line x1="0" y1="5" x2="0" y2="10" stroke="#a9b1d6" stroke-width="1"/>
        <circle cx="0" cy="11" r="1.6" fill="#f7768e">
          <animate attributeName="opacity" values="1;0.2;1" dur="0.9s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <!-- Link status -->
  <text x="932" y="320" text-anchor="middle" class="info dim" style="font-size:11px">SAT-LINK</text>
  <text x="932" y="338" text-anchor="middle" class="info" style="font-size:11px"><tspan class="hl">LIM</tspan> ⇄ <tspan class="ok">PAR</tspan></text>
  <circle cx="900" cy="354" r="3" fill="#9ece6a">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="908" y="358" class="info ok" style="font-size:11px">LIVE · 5G</text>
</svg>
